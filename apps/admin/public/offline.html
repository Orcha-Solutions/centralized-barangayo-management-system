<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · CBMS Admin Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #FDB913;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: #0A2463;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid #3b82f6;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .badge {
      display: inline-block;
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>Admin Console Offline</h1>
    <p>The admin console is disconnected from the network. Check your internet connection or local barangay hall router.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="badge">Centralized Barangay Management System · Admin</div>
  </div>
</body>
</html>
