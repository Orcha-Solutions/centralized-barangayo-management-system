services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cbms-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: cbms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cbms
      MINIO_ROOT_PASSWORD: cbms_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cbms_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cbms_miniodata:
